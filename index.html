<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d35"><link rel="manifest" href="manifest.webmanifest"><title>Home Project Tracker</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#20342f;background:#f4f6f3}*{box-sizing:border-box}body{margin:0}header{background:#173d35;color:white;padding:calc(env(safe-area-inset-top) + 20px) 20px 20px}header small{opacity:.75}h1{font-size:26px;margin:6px 0}main{max-width:760px;margin:auto;padding:18px 16px 100px}.card{background:white;border-radius:17px;padding:17px;margin-bottom:13px;box-shadow:0 2px 12px #1232}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#71827a;font-size:13px}.tag{font-size:12px;background:#e7f1ec;border-radius:20px;padding:5px 10px}button,.btn{background:#20664f;color:white;border:0;border-radius:11px;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer}button.secondary{background:#e8efeb;color:#1a5441}button.danger{background:#fbe9e6;color:#8b2e24}input,textarea,select{width:100%;border:1px solid #d7dfda;border-radius:10px;padding:11px;font:inherit;background:white}textarea{min-height:85px}label{display:block;font-size:13px;font-weight:600;margin:11px 0 5px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid #e2e7e3;padding:9px 6px calc(env(safe-area-inset-bottom) + 8px);z-index:3}.tabs button{flex:1;background:transparent;color:#60756b;font-size:11px;padding:7px 2px}.tabs button.active{color:#146448;background:#eaf3ee}.hidden{display:none!important}.progress{height:7px;border-radius:20px;background:#e3eae5;overflow:hidden}.progress>div{height:100%;background:#2c9b6a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.item{padding:11px 0;border-bottom:1px solid #edf0ed}.item:last-child{border:0}.check{width:19px;height:19px;vertical-align:middle}.empty{text-align:center;color:#74847b;padding:22px}.back{background:transparent;padding:0;color:#20664f}.section-title{font-size:19px;font-weight:700;margin:20px 0 12px}.tiny{font-size:11px}.pill{border:1px solid #d7e4db;border-radius:15px;padding:5px 9px}.note{white-space:pre-wrap}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:end;z-index:10}.sheet{width:100%;max-height:92vh;overflow:auto;background:#f8faf8;padding:20px;border-radius:22px 22px 0 0}.sheet h2{margin-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.status{padding:10px;border-radius:10px;background:#e7f1ec;font-size:13px;margin:10px 0}img{max-width:100%}
